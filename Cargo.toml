[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/config",
  "crates/session",
  "crates/cli",
  "crates/protocol",
  "crates/ui",
  "crates/engine",
  "crates/rpc",
  "crates/turn",
  "crates/fs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The settings document is YAML or JSON. `serde_norway` is the maintained fork
# of `serde_yaml`, which its author retired.
serde_norway = "0.9"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
clap = { version = "4", features = ["derive", "wrap_help"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tempfile = "3"
# Upstream pins some contracts with fast-check property suites; this is the
# Rust equivalent, and never more than a dev-dependency.
proptest = "1"
anstyle = "1"
terminal_size = "0.4"
# A terminal draws a CJK character in two columns and a combining mark in
# none, so every width this workspace measures is asked of this crate.
unicode-width = "0.2"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
# Already in the tree under `crossterm`; named here because `crates/ui` asks
# it for the watch that gives the terminal back when the process is killed.
signal-hook = "0.3"
