[package]
name = "tetanus-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The sandbox policy every tetanus surface applies, and the kernel backends that enforce it."

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# Landlock has no libc wrappers: the three syscalls are made by number, and
# `prctl` beside them. Nothing else in this crate needs a dependency.
libc.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
