[package]
name = "tetanus-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
tetanus-core = { path = "../core" }
tetanus-session = { path = "../session" }
tetanus-turn = { path = "../turn" }
tetanus-sandbox = { path = "../sandbox" }
# The `regex` crate rather than a hand-rolled matcher, for the property its
# own documentation leads with: matching is linear in the input, because it
# has no backreferences and no lookaround. A model supplies the pattern here,
# so a matcher that can be made to backtrack exponentially is a tool call that
# never returns.
regex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# TC-PORT-SANDBOX-23 asserts that one policy gives the file service and the
# process executor the same answer, which needs both seams in one case.
tetanus-exec = { path = "../exec" }
tempfile = { workspace = true }
serde_json = { workspace = true }
