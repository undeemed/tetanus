[package]
name = "tetanus-hardness"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tetanus"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tetanus-core = { path = "../core" }
tetanus-config = { path = "../config" }
tetanus-engine = { path = "../engine" }
tetanus-exec = { path = "../exec" }
tetanus-session = { path = "../session" }
tetanus-turn = { path = "../turn" }
tetanus-protocol = { path = "../protocol" }
tetanus-host = { path = "../host" }
tetanus-rpc = { path = "../rpc" }
tetanus-ui = { path = "../ui" }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
futures-util.workspace = true
# The WebSocket half of `tetanus serve`: the suite dials the socket the
# binary bound, so `connect` is the client side of the handshake.
tokio-tungstenite = { workspace = true, features = ["connect"] }
