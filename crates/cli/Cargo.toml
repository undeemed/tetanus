[package]
name = "tetanus-hardness"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tetanus"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tetanus-core = { path = "../core" }
tetanus-config = { path = "../config" }
tetanus-engine = { path = "../engine" }
tetanus-session = { path = "../session" }
tetanus-turn = { path = "../turn" }
tetanus-toolset = { path = "../toolset" }
# The binary starts the MCP servers a document declares. `crates/toolset`
# composes their tools but cannot start them - a handshake is asynchronous and
# a composition is not - so the connecting belongs to the surface that has a
# runtime, which is this one.
tetanus-mcp = { path = "../mcp" }
# The confinement vocabulary, for the `--sandbox` flag's value parser: a typed
# mode is refused with the list of what exists before a journal is opened.
tetanus-sandbox = { path = "../sandbox" }
tetanus-protocol = { path = "../protocol" }
tetanus-host = { path = "../host" }
tetanus-rpc = { path = "../rpc" }
tetanus-ui = { path = "../ui" }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
futures-util.workspace = true
# The WebSocket half of `tetanus serve`: the suite dials the socket the
# binary bound, so `connect` is the client side of the handshake.
tokio-tungstenite = { workspace = true, features = ["connect"] }
