<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tetanus chat</title>
<!--
  The browser half of `tetanus chat`. It speaks the published contract over the
  WebSocket carrier and nothing else: no build step, no framework, no bundler,
  so the page a reviewer opens is the file in the repository.

  The palette is the terminal's, deliberately. `tools/uiwatch` renders the real
  terminal in a browser with these colours, and a turn is supposed to read the
  same wherever it is drawn - so `you`, `ai`, a tool call and a closing line
  are worded and coloured here exactly as `crates/cli/src/render/timeline.rs`
  words and colours them.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="primitives.css">
<style>
 :root {
   color-scheme: dark;
   --bg:#14161c; --pane:#1a1d24; --line:#262a33; --text:#dcdfe4; --muted:#7f848e;
   --cyan:#56b6c2; --bright:#6fd6e0; --magenta:#c678dd; --green:#98c379;
   --yellow:#e5c07b; --red:#e06c75;
 }
 * { box-sizing:border-box; min-width:0; }
 html, body { height:100%; }
 body { margin:0; background:var(--bg); color:var(--text); display:flex; flex-direction:column;
   font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }

 header.top { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap;
   padding:14px 22px; border-bottom:1px solid var(--line); background:#0f1116; }
 header.top h1 { margin:0; font-size:15px; letter-spacing:.02em; }
 .meta { color:var(--muted); font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace; }
 .meta b { color:var(--bright); font-weight:600; }
 .state { margin-left:auto; font:12.5px ui-monospace,monospace; color:var(--muted); }
 .state::before { content:"● "; color:var(--muted); }
 .state.live::before { color:var(--green); }
 .state.busy::before { color:var(--yellow); }
 .state.gone::before { color:var(--red); }

 main { flex:1 1 auto; overflow-y:auto; padding:20px 22px 8px; display:flex; flex-direction:column; }
 /* The newest turn sits against the box it was typed into, the way the next
    prompt in a terminal sits against the last line of the answer. `margin-top`
    rather than `justify-content`, which clips the top of an overflowing
    column in more than one browser. */
 .turns { max-width:920px; width:100%; margin:auto auto 0; }

 /* One turn is one card, because a turn is the unit of work everywhere else
    in this project. The rows inside it are the terminal's rows. */
 .turn { background:var(--pane); border:1px solid var(--line); border-radius:10px;
   padding:12px 15px; margin:0 0 14px; }
 .turn > .head { color:var(--yellow); font:600 13px ui-monospace,monospace; margin-bottom:8px; }
 .row { display:flex; gap:10px; align-items:flex-start; padding:2px 0;
   font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
 .row .who { flex:0 0 auto; width:5ch; color:var(--muted); }
 .row.wide { gap:0; }
 .row .mark { flex:0 0 auto; font-weight:400; white-space:pre; }
 .row .said { flex:1 1 auto; white-space:pre-wrap; overflow-wrap:anywhere; }
 .row.you .who { color:var(--bright); font-weight:600; }
 .row.ai .who { color:var(--cyan); }
 .row.think .said { color:var(--muted); }
 .row.step .said, .row.other .said { color:var(--muted); }
 .row.call .mark { color:var(--magenta); }
 .row.ok .mark { color:var(--green); }
 .row.bad .mark { color:var(--red); }
 .row.fault .mark { color:var(--red); }
 .row.fault .said { color:var(--red); }
 /* The page answering the reader rather than the model. Muted, because it is
    this panel talking about itself and must not be mistaken for something
    the conversation produced. */
 .row.note .who, .row.note .said { color:var(--muted); }
 .empty { color:var(--muted); text-align:center; margin:34px 0; font-size:13.5px; }
 .end { color:var(--muted); font:12.5px ui-monospace,monospace; margin-top:8px; }
 /* The answer being typed. One glyph, no animation: a spinner beside text that
    is already moving says nothing the text does not. */
 .row.live .said::after { content:"▋"; color:var(--cyan); }

 footer { border-top:1px solid var(--line); background:#0f1116; padding:12px 22px 16px; }
 form { max-width:920px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
 textarea { flex:1 1 auto; resize:none; min-height:44px; max-height:180px; padding:11px 13px;
   color:var(--text); background:var(--pane); border:1px solid var(--line); border-radius:9px;
   font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
   transition:border-color 120ms ease-out; }
 textarea:focus { outline:none; border-color:#3f5d63; box-shadow:0 0 0 3px rgba(86,182,194,.12); }
 textarea:disabled { color:var(--muted); }
 button { flex:0 0 auto; padding:11px 18px; border-radius:9px; border:1px solid #2f4f55;
   background:#1d2c30; color:var(--bright); font:600 13.5px ui-sans-serif,system-ui,sans-serif;
   cursor:pointer; transition:background-color 120ms ease-out, transform 120ms ease-out; }
 /* The press is the one place this page moves: a button that does not answer a
    click reads as a button that did not receive it. */
 button:active:not(:disabled) { transform:scale(.97); }
 button:focus-visible { outline:2px solid var(--bright); outline-offset:2px; }
 /* Colour only, and only where there is a pointer to hover with: a tap on a
    touch screen leaves an ungated hover state behind, stuck on until the next
    tap lands somewhere else. Nothing on this page moves - a transcript that is
    already scrolling has no room for motion that is not the text arriving. */
 @media (hover:hover) and (pointer:fine) {
   button:hover:not(:disabled) { background:#22353a; }
 }
 button:disabled { color:var(--muted); border-color:var(--line); background:var(--pane);
   cursor:default; }
 /* Stop takes Send's seat rather than sitting beside it, so it is never the
    button a reader hits by aiming at the other one. Coloured, because it is
    the one control here that acts on work already in progress. */
 #stop { color:var(--red); border-color:var(--red); }
 #stop:hover:not(:disabled) { background:#2e1d1d; }
 .hint { max-width:920px; margin:8px auto 0; color:var(--muted); font-size:12.5px;
   display:flex; gap:14px; flex-wrap:wrap; }
 .hint .fault { color:var(--red); }
 /* The chord list is written by `keys.js`. Until it is - and on a page whose
    script never loaded - it is an empty span, and a flex gap either side of
    nothing reads as a missing word. */
 .hint span:empty { display:none; }
 /* The workspace chooser. A dialog rather than a page of its own: picking a
    directory is a question asked in the middle of something else, and a
    reader who is answering it has not left the conversation behind. */
 dialog { border:1px solid var(--line); border-radius:12px; padding:0; width:min(760px,92vw);
   background:var(--pane); color:var(--text); }
 dialog::backdrop { background:rgba(0,0,0,.55); }
 .pick-head { display:flex; gap:10px; align-items:center; padding:12px 14px;
   border-bottom:1px solid var(--line); }
 .crumbs { display:flex; flex-wrap:wrap; gap:4px; align-items:center; font:12.5px ui-monospace,monospace; }
 .crumbs button { padding:3px 7px; border-radius:6px; font:inherit; }
 .panes { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);
   height:min(46vh,340px); }
 .pane { background:var(--pane); overflow:auto; }
 .pane[hidden] { display:none; }
 /* One pane when there is one level to show, two when the parent is worth
    seeing beside it: stepping back should not make the view collapse. */
 .panes.alone { grid-template-columns:1fr; }
 /* A control you pick, not a transcript row. It was called `.row` too, and
    the two definitions collided: this one is later in the file, so it won
    `display:block` for every row of the conversation and collapsed the `who`
    column into the message - `youhello there`. One name, two meanings, and
    the surface that lost was the main one. */
 .choice { display:block; width:100%; text-align:left; border:0; border-radius:0;
   padding:7px 12px; font:13px ui-monospace,monospace; background:transparent; color:var(--text); }
 .choice:hover:not(:disabled) { background:#22353a; }
 .choice.here { background:#24424a; }
 .choice.dot { color:var(--muted); }
 .pick-foot { display:flex; gap:10px; align-items:center; padding:11px 14px;
   border-top:1px solid var(--line); }
 .pick-foot .grow { margin-left:auto; }
 .pick-note { font:12.5px ui-monospace,monospace; color:var(--muted); }
 .pick-note.fault { color:var(--red); }
 /* Wrapped onto its own line, the state has no row to sit at the end of. */
 @media (max-width:620px) { .state { margin-left:0; } }
</style>
</head>
<body>
<header class="top">
  <h1>tetanus chat</h1>
  <span class="meta" id="where">connecting…</span>
  <span class="meta" id="who"></span>
  <!-- The Alt chord each of these answers to is set from `keys.js`, which is
       also what listens for it: a shortcut named in one file and heard in
       another is a shortcut that goes stale silently. -->
  <button id="catalogue-open" type="button" class="choice" style="width:auto;border:1px solid var(--line);border-radius:8px">
    models…
  </button>
  <button id="trace-open" type="button" class="choice" style="width:auto;border:1px solid var(--line);border-radius:8px">
    trace…
  </button>
  <button id="sessions-open" type="button" class="choice" style="width:auto;border:1px solid var(--line);border-radius:8px">
    sessions…
  </button>
  <button id="pick" type="button" class="choice" style="width:auto;border:1px solid var(--line);border-radius:8px">
    workspace…
  </button>
  <span class="state" id="state">offline</span>
</header>

<dialog id="catalogue" class="modal">
  <div class="modal-head"><h2 class="modal-title">What this build can run</h2></div>
  <div class="modal-body">
    <div id="catalogue-models" class="list"></div>
    <div id="catalogue-tools" class="list"></div>
    <div id="catalogue-settings" class="list"></div>
  </div>
  <div class="modal-foot"><button type="button" id="catalogue-close">Close</button></div>
</dialog>

<dialog id="trace" class="modal">
  <div class="modal-head"><h2 class="modal-title">What this run did</h2></div>
  <div class="modal-body">
    <div id="standing" class="list"></div>
    <div id="trace-body" class="list"></div>
  </div>
  <div class="modal-foot"><button type="button" id="trace-close">Close</button></div>
</dialog>

<dialog id="sessions" class="modal">
  <div class="modal-head"><h2 class="modal-title">Conversations</h2></div>
  <div class="modal-body"><div id="session-list" class="list"></div></div>
  <div class="modal-foot"><button type="button" id="sessions-close">Close</button></div>
</dialog>

<dialog id="picker">
  <div class="pick-head">
    <nav class="crumbs" id="crumbs" aria-label="path"></nav>
  </div>
  <div class="panes" id="panes">
    <div class="pane" id="parent"></div>
    <div class="pane" id="here"></div>
  </div>
  <div class="pick-foot">
    <label class="pick-note"><input type="checkbox" id="dots"> show hidden</label>
    <span class="pick-note" id="picknote"></span>
    <span class="grow"></span>
    <button type="button" id="newdir">New folder</button>
    <button type="button" id="pickclose">Close</button>
  </div>
</dialog>

<main id="scroll"><div class="turns" id="turns"></div></main>

<footer>
  <form id="composer">
    <textarea id="asked" rows="1" placeholder="Ask something…"
      autocomplete="off" autofocus disabled></textarea>
    <!-- One seat, two controls. A Stop that appears beside Send would move
         Send under the reader's cursor the moment a turn starts, and the
         button they meant to press is not the one they would hit. -->
    <button id="send" type="submit" disabled>Send</button>
    <button id="stop" type="button" hidden>Stop</button>
  </form>
  <p class="hint">
    <span id="hint">Waiting for the server.</span>
    <span>Enter sends · Shift+Enter is a new line</span>
    <span id="chords"></span>
  </p>
</footer>

<script type="module" src="chat.js"></script>
</body>
</html>
